<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南京及周边 · 两年游玩打卡</title>
<style>
  :root {
    --bg: #f5f0e8;
    --card: #fffdf8;
    --ink: #2b2b2b;
    --sub: #8a8378;
    --red: #b5372f;
    --red-soft: #e8d5d0;
    --line: #e6ddcf;
    --green: #4a7c59;
    --gold: #c9a15a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    padding-bottom: 60px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 18px; }

  header {
    padding: 40px 0 22px;
    text-align: center;
  }
  header .seal {
    display: inline-block;
    width: 52px; height: 52px; line-height: 52px;
    background: var(--red); color: #fff;
    font-size: 22px; font-weight: 700;
    border-radius: 8px;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  header p.sub {
    color: var(--sub);
    font-size: 14px;
    margin-top: 6px;
  }

  /* 进度条 */
  .progress-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.03);
  }
  .progress-top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
  }
  .progress-top .num { font-size: 24px; font-weight: 700; color: var(--red); }
  .progress-top .total { color: var(--sub); font-size: 13px; }
  .bar {
    height: 10px; background: #ede5d7; border-radius: 99px; overflow: hidden;
  }
  .bar > i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--red), var(--gold));
    border-radius: 99px;
    transition: width .4s ease;
  }
  .progress-note { color: var(--sub); font-size: 12px; margin-top: 10px; }

  /* 筛选 */
  .filters {
    display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .filters button {
    border: 1px solid var(--line); background: var(--card);
    color: var(--ink); padding: 7px 16px; border-radius: 99px;
    font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .filters button.active {
    background: var(--red); border-color: var(--red); color: #fff;
  }

  /* 分组 */
  .group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.03);
  }
  .group-head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px; cursor: pointer; user-select: none;
  }
  .group-head .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--red);
    flex: none;
  }
  .group-head .gtitle { font-weight: 700; font-size: 16px; }
  .group-head .gsub { color: var(--sub); font-size: 12px; margin-left: 2px; }
  .group-head .gcount { margin-left: auto; font-size: 12px; color: var(--sub); flex: none; }
  .group-head .arrow { flex: none; color: var(--sub); transition: transform .2s; }
  .group.collapsed .arrow { transform: rotate(-90deg); }
  .group.collapsed .items { display: none; }

  .items { border-top: 1px solid var(--line); }
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid #f0e9dc;
    cursor: pointer;
    transition: background .12s;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: #faf5ec; }
  .item .box {
    width: 22px; height: 22px; border-radius: 6px;
    border: 2px solid #d8cdb8; flex: none;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
    color: #fff; font-size: 14px; font-weight: 700;
  }
  .item.done .box { background: var(--green); border-color: var(--green); }
  .item .name { font-size: 15px; flex: 1; }
  .item .note { font-size: 12px; color: var(--sub); text-align: right; flex: none; }
  .item.done .name { color: #a8a098; text-decoration: line-through; }
  .item.done .note { opacity: .55; }

  footer {
    text-align: center; color: var(--sub); font-size: 12px;
    margin-top: 30px;
  }
  footer button {
    background: none; border: none; color: var(--sub);
    text-decoration: underline; cursor: pointer; font-size: 12px;
  }
  .sync-card { margin-top: 16px; }
  .sync-card .sync-title { font-weight: 700; margin-bottom: 8px; }
  .sync-card .sync-desc { color: var(--sub); font-size: 13px; margin-bottom: 10px; }
  .sync-btns { display: flex; gap: 8px; margin-bottom: 10px; }
  .sync-btn {
    border: 1px solid var(--line); background: #fff;
    color: var(--ink); padding: 8px 16px; border-radius: 8px;
    font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .sync-btn:hover { background: var(--red); border-color: var(--red); color: #fff; }
  #syncBox {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; font-size: 12px; font-family: ui-monospace, Consolas, monospace;
    resize: vertical; background: #faf5ec; color: var(--ink);
    box-sizing: border-box; line-height: 1.5;
  }
  .add-btn {
    border: 1px dashed var(--red); background: #fff;
    color: var(--red); padding: 8px 16px; border-radius: 99px;
    font-size: 13px; cursor: pointer;
  }
  .add-btn:hover { background: var(--red); color: #fff; border-color: var(--red); }
  .custom-tag {
    font-size: 11px; color: var(--gold); border: 1px solid var(--gold);
    border-radius: 4px; padding: 0 4px; margin-left: 6px; white-space: nowrap;
  }
  .item .del {
    flex: none; width: 22px; height: 22px; line-height: 22px;
    text-align: center; border-radius: 50%; color: var(--sub);
    font-size: 18px; cursor: pointer; margin-left: 4px;
  }
  .item .del:hover { background: var(--red-soft); color: var(--red); }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center; z-index: 99;
  }
  .modal {
    background: var(--card); border-radius: 14px; padding: 24px;
    width: 90%; max-width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,.2);
  }
  .modal-title { font-weight: 700; font-size: 17px; margin-bottom: 16px; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .modal-field input, .modal-field select {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 10px; font-size: 14px; background: #fff; color: var(--ink);
    box-sizing: border-box;
  }
  .modal-field input:focus, .modal-field select:focus { outline: none; border-color: var(--red); }
  .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .sync-btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .sync-btn.primary:hover { background: #9c2f28; }
  .board-title {
    font-size: 20px; font-weight: 700; margin: 0 0 14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seal">游</div>
    <h1>南京及周边 · 两年游玩打卡</h1>
    <p class="sub">读研两年，玩遍金陵与江南 —— 去过的就勾上</p>
  </header>

  <div class="board-title">📍 景点打卡</div>

  <div class="progress-card">
    <div class="progress-top">
      <span class="num"><span id="doneCount">0</span><span class="total"> / <span id="allCount">0</span> 处</span></span>
      <span class="total" id="pctText">0%</span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="progress-note" id="progressNote"></div>
  </div>

  <div class="filters">
    <button data-filter="all" class="active">全部</button>
    <button data-filter="todo">还没去</button>
    <button data-filter="done">已打卡</button>
  </div>

  <div style="margin-bottom:18px;">
    <button id="addSpotBtn" class="add-btn">+ 添加景点</button>
  </div>

  <div id="groups"></div>

  <div class="board-title" style="margin-top:32px;">🍜 美食打卡</div>
  <div style="margin-bottom:18px;">
    <button id="addFoodBtn" class="add-btn">+ 添加美食</button>
  </div>
  <div id="foodGroups"></div>

  <div class="progress-card sync-card">
    <div class="sync-title">↔ 同步进度（和室友共享）</div>
    <div class="sync-desc">勾选存各自浏览器。想对进度：点「导出」复制一段码发室友，对方粘贴后点「导入」；导入会把对方打卡过的景点合并进来，你自己勾的不丢。</div>
    <div class="sync-btns">
      <button id="exportBtn" class="sync-btn">导出进度</button>
      <button id="importBtn" class="sync-btn">导入进度</button>
    </div>
    <textarea id="syncBox" rows="3" placeholder="点「导出」后这里会出现一段码，复制发给室友；或把室友的码粘贴到这里再点「导入」"></textarea>
  </div>

  <footer>
    勾选状态自动保存在本浏览器，关掉再打开也不会丢 ·
    <button id="resetBtn">重置全部</button>
  </footer>
</div>

<div class="modal-mask" id="addModal" style="display:none;">
  <div class="modal">
    <div class="modal-title">添加景点</div>
    <div class="modal-field">
      <label>景点名（必填）</label>
      <input id="spotName" type="text" placeholder="例如：紫金山" />
    </div>
    <div class="modal-field">
      <label>归属大类</label>
      <select id="spotGroup">
        <option value="0">第一圈 · 南京市区</option>
        <option value="1">第二圈 · 高铁1小时圈</option>
        <option value="2">第三圈 · 高铁1.5–2小时圈</option>
        <option value="3">第四圈 · 稍远但值得</option>
      </select>
    </div>
    <div class="modal-field">
      <label>备注（选填）</label>
      <input id="spotNote" type="text" placeholder="例如：秋天去" />
    </div>
    <div class="modal-btns">
      <button id="cancelAdd" class="sync-btn">取消</button>
      <button id="confirmAdd" class="sync-btn primary">添加</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="addFoodModal" style="display:none;">
  <div class="modal">
    <div class="modal-title">添加美食</div>
    <div class="modal-field">
      <label>美食名（必填）</label>
      <input id="foodName" type="text" placeholder="例如：蟹黄汤包" />
    </div>
    <div class="modal-field">
      <label>所在地</label>
      <select id="foodGroup">
        <option value="0">南京市区</option>
        <option value="1">高铁1小时圈</option>
        <option value="2">高铁1.5–2小时圈</option>
        <option value="3">稍远</option>
      </select>
    </div>
    <div class="modal-field">
      <label>备注（选填）</label>
      <input id="foodNote" type="text" placeholder="例如：某店招牌" />
    </div>
    <div class="modal-btns">
      <button id="cancelFood" class="sync-btn">取消</button>
      <button id="confirmFood" class="sync-btn primary">添加</button>
    </div>
  </div>
</div>

const FOOD_GROUPS = [
  {
    title: "南京市区",
    sub: "本地小吃、老字号",
    items: [
      { name: "鸭血粉丝汤", note: "金陵头牌" },
      { name: "盐水鸭", note: "南京特产" },
      { name: "小笼汤包", note: "老门东、汤包馆" },
      { name: "牛肉锅贴", note: "七家湾" },
      { name: "糖芋苗 / 赤豆元宵", note: "甜品" },
    ]
  },
  {
    title: "高铁1小时圈",
    sub: "镇江、扬州、常州、无锡",
    items: []
  },
  {
    title: "高铁1.5–2小时圈",
    sub: "苏州、上海、杭州",
    items: []
  },
  {
    title: "稍远",
    sub: "徽州等地",
    items: []
  },
];

const STORE_KEY = "nanjing-travel-checked-v2";

function loadChecked() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function saveChecked(map) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(map)); } catch (e) {}
}

let checked = loadChecked();
let currentFilter = "all";

const CUSTOM_KEY = "nanjing-travel-custom-v1";
function loadCustom() {
  try {
    const raw = localStorage.getItem(CUSTOM_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveCustom(arr) {
  try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(arr)); } catch (e) {}
}
let customSpots = loadCustom();

const FOOD_CUSTOM_KEY = "nanjing-travel-custom-foods-v1";
function loadCustomFoods() {
  try {
    const raw = localStorage.getItem(FOOD_CUSTOM_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveCustomFoods(arr) {
  try { localStorage.setItem(FOOD_CUSTOM_KEY, JSON.stringify(arr)); } catch (e) {}
}
let customFoods = loadCustomFoods();

function idOf(groupIdx, itemIdx) {
  return groupIdx + "-" + itemIdx;
}

function renderBoard(elId, groups, customs, keyFn) {
  const container = document.getElementById(elId);
  container.innerHTML = "";

  let done = 0, all = 0;

  groups.forEach((group, gi) => {
    // 合并内置条目 + 该组自定义条目
    const groupItems = [];
    group.items.forEach((item, ii) => {
      groupItems.push({ name: item.name, note: item.note || "", id: keyFn(gi, ii), custom: false });
    });
    customs.forEach(s => {
      if (s.group === gi) groupItems.push({ name: s.name, note: s.note || "", id: s.id, custom: true });
    });

    let groupDone = 0;
    groupItems.forEach(it => {
      all++;
      if (!!checked[it.id]) { done++; groupDone++; }
    });

    const visibleCount = groupItems.filter(it => matchesFilter(!!checked[it.id])).length;
    if (currentFilter !== "all" && visibleCount === 0) return;

    const groupEl = document.createElement("div");
    groupEl.className = "group";

    const head = document.createElement("div");
    head.className = "group-head";
    head.innerHTML = `
      <span class="dot"></span>
      <span class="gtitle">${group.title}</span>
      <span class="gsub">${group.sub}</span>
      <span class="gcount">${groupDone}/${groupItems.length}</span>
      <span class="arrow">▼</span>
    `;
    head.addEventListener("click", () => groupEl.classList.toggle("collapsed"));
    groupEl.appendChild(head);

    const itemsWrap = document.createElement("div");
    itemsWrap.className = "items";

    groupItems.forEach(it => {
      const isDone = !!checked[it.id];
      if (!matchesFilter(isDone)) return;

      const row = document.createElement("div");
      row.className = "item" + (isDone ? " done" : "");
      row.innerHTML = `
        <span class="box">${isDone ? "✓" : ""}</span>
        <span class="name">${it.name}${it.custom ? '<span class="custom-tag">自加</span>' : ""}</span>
        <span class="note">${it.note || ""}</span>
        ${it.custom ? '<span class="del" title="删除">×</span>' : ""}
      `;
      row.addEventListener("click", (e) => {
        if (e.target.classList.contains("del")) { removeCustom(it.id); return; }
        checked[it.id] = !checked[it.id];
        saveChecked(checked);
        render();
      });
      itemsWrap.appendChild(row);
    });

    groupEl.appendChild(itemsWrap);
    container.appendChild(groupEl);
  });

  return { done, all };
}

function render() {
  const stats = renderBoard("groups", DATA, customSpots, idOf);
  renderBoard("foodGroups", FOOD_GROUPS, customFoods, (gi, ii) => "food-" + gi + "-" + ii);

  document.getElementById("doneCount").textContent = stats.done;
  document.getElementById("allCount").textContent = stats.all;
  const pct = stats.all ? Math.round(stats.done / stats.all * 100) : 0;
  document.getElementById("pctText").textContent = pct + "%";
  document.getElementById("barFill").style.width = pct + "%";

  const noteEl = document.getElementById("progressNote");
  if (stats.done === 0) noteEl.textContent = "青春就在当下！";
  else if (stats.done === stats.all) noteEl.textContent = "全部打卡！江南已是你的后花园 🎉";
  else if (stats.done >= 20) noteEl.textContent = "过半了，进度喜人，继续解锁更远的地方。";
  else noteEl.textContent = "继续走，周末别宅宿舍。";
}

function matchesFilter(isDone) {
  if (currentFilter === "all") return true;
  if (currentFilter === "done") return isDone;
  if (currentFilter === "todo") return !isDone;
  return true;
}

document.querySelectorAll(".filters button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("确定要清空所有打卡记录吗？")) {
    checked = {};
    saveChecked(checked);
    render();
  }
});

function b64encode(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64decode(s) { return decodeURIComponent(escape(atob(s))); }

function removeCustom(id) {
  if (id.indexOf("food-custom-") === 0) {
    customFoods = customFoods.filter(s => s.id !== id);
    saveCustomFoods(customFoods);
  } else {
    customSpots = customSpots.filter(s => s.id !== id);
    saveCustom(customSpots);
  }
  delete checked[id];
  saveChecked(checked);
  render();
}

document.getElementById("exportBtn").addEventListener("click", () => {
  const payload = { checked: checked, customSpots: customSpots, customFoods: customFoods };
  const code = b64encode(JSON.stringify(payload));
  const box = document.getElementById("syncBox");
  box.value = code;
  box.select();
  try { navigator.clipboard.writeText(code); } catch (e) {}
  alert("同步码已生成并复制，直接发给室友即可（含进度、景点和美食）。");
});

document.getElementById("importBtn").addEventListener("click", () => {
  const code = document.getElementById("syncBox").value.trim();
  if (!code) { alert("请先把室友发你的同步码粘贴到上面框里"); return; }
  try {
    const parsed = JSON.parse(b64decode(code));
    if (parsed && typeof parsed === "object") {
      const ck = parsed.checked || parsed;                       // 兼容旧格式（纯勾选对象）
      const spots = Array.isArray(parsed.customSpots) ? parsed.customSpots : [];
      const foods = Array.isArray(parsed.customFoods) ? parsed.customFoods : [];
      for (const k in ck) { if (ck[k]) checked[k] = true; }      // 只合并"已打卡"，不冲掉你的
      const existSpots = new Set(customSpots.map(s => s.id));
      spots.forEach(s => { if (s && s.id && !existSpots.has(s.id)) { customSpots.push(s); existSpots.add(s.id); } });
      const existFoods = new Set(customFoods.map(s => s.id));
      foods.forEach(s => { if (s && s.id && !existFoods.has(s.id)) { customFoods.push(s); existFoods.add(s.id); } });
      saveChecked(checked);
      saveCustom(customSpots);
      saveCustomFoods(customFoods);
      render();
      alert("导入成功，进度、景点和美食都已合并！");
    } else {
      throw new Error("bad");
    }
  } catch (e) {
    alert("同步码不对，请确认复制完整后重试。");
  }
});

// —— 添加景点 ——
const addModal = document.getElementById("addModal");
document.getElementById("addSpotBtn").addEventListener("click", () => {
  document.getElementById("spotName").value = "";
  document.getElementById("spotNote").value = "";
  document.getElementById("spotGroup").value = "0";
  addModal.style.display = "flex";
  document.getElementById("spotName").focus();
});
function closeAddModal() { addModal.style.display = "none"; }
document.getElementById("cancelAdd").addEventListener("click", closeAddModal);
addModal.addEventListener("click", (e) => { if (e.target === addModal) closeAddModal(); });
document.getElementById("confirmAdd").addEventListener("click", () => {
  const name = document.getElementById("spotName").value.trim();
  const note = document.getElementById("spotNote").value.trim();
  const group = parseInt(document.getElementById("spotGroup").value, 10);
  if (!name) { alert("请填写景点名"); return; }
  customSpots.push({ id: "custom-" + Date.now(), name: name, note: note, group: group });
  saveCustom(customSpots);
  closeAddModal();
  render();
});
